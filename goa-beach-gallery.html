<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goan Beach Gallery</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0a0a;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
}

h1 {
    text-align: center;
    padding: 30px 0;
    font-size: 2.2em;
    text-transform: uppercase;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #00fff7, #ff00de);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* ============ THUMBNAIL GALLERY ============ */
.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px 50px;
}

.gallery-item {
    position: relative;
    cursor: pointer;
    overflow: hidden;
    border-radius: 8px;
    aspect-ratio: 4 / 3;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 2px solid #333;
}

.gallery-item:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(0, 255, 247, 0.5);
    border-color: #00fff7;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.gallery-item .label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    color: #fff;
    padding: 18px 10px 8px;
    font-size: 0.85em;
    font-weight: bold;
    text-align: center;
}

/* ============ LIGHTBOX ============ */
.lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.95);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.lightbox.active {
    display: flex;
}

.lightbox-close {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 45px;
    height: 45px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid #fff;
    border-radius: 50%;
    color: #fff;
    font-size: 1.5em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10001;
    transition: background 0.2s;
}

.lightbox-close:hover {
    background: rgba(255, 0, 0, 0.5);
}

.lightbox-image-wrapper {
    max-width: 85%;
    max-height: 80vh;
    position: relative;
}

.lightbox-image {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(0, 255, 247, 0.2);
}

.lightbox-caption {
    color: #fff;
    font-size: 1.3em;
    margin-top: 15px;
    text-align: center;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(0, 255, 247, 0.5);
}

.lightbox-prev,
.lightbox-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 50px;
    height: 50px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid #fff;
    border-radius: 50%;
    color: #fff;
    font-size: 1.5em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: background 0.2s;
}

.lightbox-prev:hover,
.lightbox-next:hover {
    background: rgba(0, 255, 247, 0.3);
}

.lightbox-prev {
    left: 20px;
}

.lightbox-next {
    right: 20px;
}

@media (max-width: 768px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<h1>Goan Beach Gallery</h1>

<div class="gallery" id="gallery">
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="closeBtn" title="Close">✕</button>
    <button class="lightbox-prev" id="prevBtn" title="Previous">‹</button>
    <div class="lightbox-image-wrapper">
        <img class="lightbox-image" id="lightboxImg" src="" alt="">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
    <button class="lightbox-next" id="nextBtn" title="Next">›</button>
</div>

<script>
// ============ 16 DISTINCT BEACH SLOTS (ADD YOUR IMAGE URLS / PATHS BELOW) ============
const beachData = [
    { name: "Keri Beach", thumb: "images/67ce771543ce335020b7e7af_1741584149516.jpg", full: "images/67ce771543ce335020b7e7af_1741584149516.jpg" },
    { name: "Sinquerim Beach", thumb: "images/67ce771543ce335020b7e7b0_1741584149518.jpg", full: "images/67ce771543ce335020b7e7b0_1741584149518.jpg" },
    { name: "Kalacha Beach", thumb: "images/67ce771543ce335020b7e7b1_1741584149521.jpg", full: "images/67ce771543ce335020b7e7b1_1741584149521.jpg" },
    { name: "Siridao Beach", thumb: "images/67ce771543ce335020b7e7b2_1741584149522.jpg", full: "images/67ce771543ce335020b7e7b2_1741584149522.jpg" },
    { name: "Candolim Beach", thumb: "images/67ce771543ce335020b7e7b3_1741584149523.jpg", full: "images/67ce771543ce335020b7e7b3_1741584149523.jpg" },
    { name: "Mandrem Beach", thumb: "images/67ce771643ce335020b7e7b4_1741584150408.jpg", full: "images/67ce771643ce335020b7e7b4_1741584150408.jpg" },
    { name: "Ozran Beach", thumb: "images/67ce771643ce335020b7e7b5_1741584150448.jpg", full: "images/67ce771643ce335020b7e7b5_1741584150448.jpg" },
    { name: "Tambduki Beach", thumb: "images/67ce771643ce335020b7e7b6_1741584150450.jpg", full: "images/67ce771643ce335020b7e7b6_1741584150450.jpg" },
    { name: "Chapora Beach", thumb: "images/67ce771643ce335020b7e7b7_1741584150451.jpg", full: "images/67ce771643ce335020b7e7b7_1741584150451.jpg" },
    { name: "Bambolim Beach", thumb: "images/67ce771643ce335020b7e7b8_1741584150478.jpg", full: "images/67ce771643ce335020b7e7b8_1741584150478.jpg" },
    { name: "Arambol Beach", thumb: "images/67ce771743ce335020b7e7b9_1741584151115.jpg", full: "images/67ce771743ce335020b7e7b9_1741584151115.jpg" },
    { name: "Morjim Beach", thumb: "images/67ce771743ce335020b7e7ba_1741584151122.jpg", full: "images/67ce771743ce335020b7e7ba_1741584151122.jpg" },
    { name: "Anjuna Beach", thumb: "images/67ce771743ce335020b7e7bb_1741584151204.jpg", full: "images/67ce771743ce335020b7e7bb_1741584151204.jpg" },
    { name: "Vagator Beach", thumb: "images/67ce771743ce335020b7e7bc_1741584151331.jpg", full: "images/67ce771743ce335020b7e7bc_1741584151331.jpg" },
    { name: "Ashvem Beach", thumb: "images/67ce771743ce335020b7e7bd_1741584151506.jpg", full: "images/67ce771743ce335020b7e7bd_1741584151506.jpg" },
    { name: "Coco Beach", thumb: "images/67ce771743ce335020b7e7be_1741584151796.jpg", full: "images/67ce771743ce335020b7e7be_1741584151796.jpg" }
];

// ============ ENGINE AND GENERATION ============
const galleryEl = document.getElementById('gallery');
const lightbox  = document.getElementById('lightbox');
const lightboxImg     = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');
const closeBtn = document.getElementById('closeBtn');
const prevBtn  = document.getElementById('prevBtn');
const nextBtn  = document.getElementById('nextBtn');

let currentIndex = 0;

beachData.forEach((beach, index) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = `
        <img src="${beach.thumb}" alt="${beach.name}" loading="lazy">
        <div class="label">${beach.name}</div>
    `;
    item.addEventListener('click', () => openLightbox(index));
    galleryEl.appendChild(item);
});

function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('active');
}

function closeLightbox() {
    lightbox.classList.remove('active');
}

function nextImage() {
    currentIndex = (currentIndex + 1) % beachData.length;
    updateLightbox();
}

function prevImage() {
    currentIndex = (currentIndex - 1 + beachData.length) % beachData.length;
    updateLightbox();
}

function updateLightbox() {
    const beach = beachData[currentIndex];
    lightboxImg.src = beach.full;
    lightboxImg.alt = beach.name;
    lightboxCaption.textContent = beach.name;
}

closeBtn.addEventListener('click', closeLightbox);
nextBtn.addEventListener('click', nextImage);
prevBtn.addEventListener('click', prevImage);

lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
        closeLightbox();
    }
});

document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  prevImage();
    if (e.key === 'ArrowRight') nextImage();
});
</script>

</body>
</html>
